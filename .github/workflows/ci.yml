name: Непрерывная проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Java и Gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Настроить Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Настроить Gradle Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Выполнить проверки качества
        run: ./gradlew qualityCheck --no-daemon --stacktrace

      - name: Сохранить отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установить Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Проверить chart
        run: helm lint ./deploy/helm/orderflow --strict

      - name: Сформировать Kubernetes-манифесты
        run: |
          mkdir -p ./build/rendered-kubernetes
          helm template orderflow ./deploy/helm/orderflow \
            --namespace orderflow \
            --values ./deploy/helm/orderflow/values-production.example.yaml \
            --set-string image.tag="ci-${GITHUB_SHA}" \
            > ./build/rendered-kubernetes/orderflow.yaml

      - name: Сохранить сформированные манифесты
        uses: actions/upload-artifact@v7
        with:
          name: rendered-kubernetes-manifests
          path: ./build/rendered-kubernetes/orderflow.yaml
          if-no-files-found: error
          retention-days: 14
