image:
  registry: registry.example.com/orderflow
  pullPolicy: IfNotPresent
  tag: "2026.10.27-CHANGE_ME"

commonConfig:
  SPRING_PROFILES_ACTIVE: production
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "9080"
  MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
  MANAGEMENT_ENDPOINTS: health,info,prometheus
  MANAGEMENT_QUEUE_METRICS_REFRESH_INTERVAL: 30s
  LOG_FORMAT: ecs
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
  KAFKA_BOOTSTRAP_SERVERS: kafka.production.example:9092
  REDIS_HOST: redis.production.example
  REDIS_PORT: "6379"
  CATALOG_CACHE_ENABLED: "true"
  CATALOG_PUBLIC_PRODUCT_CACHE_TTL: 1m
  CATALOG_PUBLIC_OFFER_CACHE_TTL: 30s
  JWT_ISSUER: identity-service

# HPA включается только после установки Metrics Server и получения нагрузочного baseline.
services:
  order-service:
    # Если digest задан, он имеет приоритет над общим image.tag.
    digest: ""
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65
