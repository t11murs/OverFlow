server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15436/payment_service}
    username: ${DB_USERNAME:payment_service}
    password: ${DB_PASSWORD:payment_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: payment-scheduler-

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9085}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
    info:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:identity-service}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

messaging:
  consumer-retry:
    max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
    retry-delay: ${KAFKA_CONSUMER_RETRY_DELAY:1s}
    dlq-suffix: ${KAFKA_DLQ_SUFFIX:.dlq}
  topics:
    payment-commands: ${PAYMENT_COMMANDS_TOPIC:orderflow.payment.commands.v1}
    payment-events: ${PAYMENT_EVENTS_TOPIC:orderflow.payment.events.v1}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-delay: ${OUTBOX_POLL_DELAY:1s}
    lease-duration: ${OUTBOX_LEASE_DURATION:30s}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:10s}
    retry-initial-delay: ${OUTBOX_RETRY_INITIAL_DELAY:1s}
    retry-max-delay: ${OUTBOX_RETRY_MAX_DELAY:5m}

payments:
  processing:
    batch-size: ${PAYMENT_PROCESSING_BATCH_SIZE:20}
    max-attempts: ${PAYMENT_PROCESSING_MAX_ATTEMPTS:10}
    poll-delay: ${PAYMENT_PROCESSING_POLL_DELAY:1s}
    lease-duration: ${PAYMENT_PROCESSING_LEASE_DURATION:1m}
    retry-initial-delay: ${PAYMENT_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${PAYMENT_RETRY_MAX_DELAY:15m}
