server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15434/inventory_service}
    username: ${DB_USERNAME:inventory_service}
    password: ${DB_PASSWORD:inventory_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:inventory-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: inventory-scheduler-

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9083}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
    info:
      access: read-only
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:identity-service}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  service-jwt:
    secret: ${SERVICE_JWT_SECRET}
    issuer: order-service
    audience: inventory-service
  catalog-service-jwt:
    secret: ${SERVICE_JWT_SECRET}
    issuer: inventory-service
    audience: catalog-service
    ttl: ${SERVICE_JWT_TTL:30s}

clients:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8082}
    connect-timeout: ${CATALOG_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOG_READ_TIMEOUT:3s}

inventory:
  reservation-ttl: ${INVENTORY_RESERVATION_TTL:15m}
  expiry-batch-size: ${INVENTORY_EXPIRY_BATCH_SIZE:100}
  expiry-scan-delay: ${INVENTORY_EXPIRY_SCAN_DELAY:30s}

messaging:
  consumer-retry:
    max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
    retry-delay: ${KAFKA_CONSUMER_RETRY_DELAY:1s}
    dlq-suffix: ${KAFKA_DLQ_SUFFIX:.dlq}
  topics:
    inventory-commands: ${INVENTORY_COMMANDS_TOPIC:orderflow.inventory.commands.v1}
    inventory-events: ${INVENTORY_EVENTS_TOPIC:orderflow.inventory.events.v1}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    poll-delay: ${OUTBOX_POLL_DELAY:1s}
    lease-duration: ${OUTBOX_LEASE_DURATION:30s}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:10s}
    retry-initial-delay: ${OUTBOX_RETRY_INITIAL_DELAY:1s}
    retry-max-delay: ${OUTBOX_RETRY_MAX_DELAY:5m}
